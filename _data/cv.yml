  summary: >
    Mechatronics engineering student completing a DHIK double degree between Tecnológico de Monterrey (Mexico) and
    Hochschule Zittau/Görlitz (Germany), specializing in electrical engineering. Experience spans embedded systems
    (PCB design, ESP32/FreeRTOS firmware, CAN/SPI/I2C/UART), model-based control (MATLAB/Simulink/Simscape, PID),
    and industrial automation (Siemens TIA Portal, Allen-Bradley, digital twins with Process Simulate and Universal
    Robots cobots), plus laboratory testing and characterization of electronic hardware. Available for internships
    and Bachelor thesis projects in Germany from March 2027 (full-time, up to 6 months).

  sections:
    Experience:
      - company: EcoVolt CCM EV Racing Team (Shell Eco-marathon)
        position: Team Captain, Electronics Lead & Mentor
        location: Mexico City, Mexico
        start_date: 2023-08
        end_date: 2026-08
        summary: Led and mentored a 30+ person multidisciplinary team across mechanical, electrical, telemetry, and data-analysis systems for Shell Eco-marathon Americas, Brazil, and United States 2025–2026.
        highlights:
          - Designed the telemetry PCBs in Altium Designer (schematic, layout, BOM) — the Brazil 2025 board, main contributor to US 2026 and co-designer of Brazil 2026 — and brought them up and debugged them on the vehicle
          - Linked the in-house motor controller to the telemetry system by implementing the CAN communication (incl. transceiver circuit) and writing ESP32 firmware in C++ with SPI, I2C, UART and SD drivers, logging current, voltage and GPS position in real time
          - Developed a bidirectional INA240 shunt current sensor from a self-etched prototype to a manufactured board, verified with oscilloscope and multimeter
          - Performed BLDC drive measurements and contributed to the transfer functions of its current and speed loops in MATLAB/Simulink
          - Characterized transistors and Zener, Schottky and rectifier diodes in the lab to select the components of a supercapacitor energy backup system
          - Built, with the team, a Python HiL test bench (real traction motor and driving simulator) showing with measured data that constant throttle is more efficient than pulse-and-glide
          - Validated cockpit layout and seating position with an ergonomic RULA analysis (virtual human model in Tecnomatix Process Simulate), contributing to the 2026 Vehicle Design Award
          - Proposed a QR inventory system for tools and PPE and programmed its first Python/OpenCV version (generated QR codes, automatic detection, scan logging) to track material at competitions
          - "Results: 1st place Vehicle Design Award (2026), 1st/2nd place Data & Telemetry Award (2025/2026) — see Awards below"

      - company: MIT.nano Lab, Massachusetts Institute of Technology
        position: Visiting Student — Semiconductor Fabrication Intensive
        location: Cambridge, MA, USA
        start_date: 2025-10
        end_date: 2025-10
        highlights:
          - Hands-on device fabrication (semiconductors, solar cells, microfluidics) via thin-film deposition (PECVD/PVD) and chemical etching
          - Ran photolithography and characterization processes in Class 100/1K/10K cleanrooms under strict safety protocols
          - "Characterized the fabricated devices: IV curve of the solar cell, force–displacement test of the MEMS cantilever and flow tests of the microfluidic mixer"

    Projects:
      - name: Digital Twin of a Flexible CNC Manufacturing Cell — ORZA Tech industry challenge
        url: /projects/orza-digital-twin/
        start_date: 2026-02
        end_date: 2026-06
        summary: "Team of 3, one station per member · virtual commissioning with no physical hardware"
        highlights:
          - "Commissioned my station fully in simulation: digital twin in Process Simulate (3 UR5 cobots, AGV, conveyors, CNC mill, camera) driven by a virtual S7-1500 (PLCSIM Advanced)"
          - "Programmed the TIA Portal ladder logic (step sequence, interlocks, manual mode, quality routing) and the WinCC HMI"
          - "Built the plant-wide SCADA screen (OEE, cycle time, scrap rate), a C# Modbus TCP sensor and an S7 GET/PUT link with link-loss alarm"
          - "Synchronized a UR5 program in URSim with the PLC via I/O handshake, after hands-on work on a physical UR5e"
          - "Programmed the part in SOLIDWORKS CAM (≈ 12.8 min cycle) and validated a Cognex In-Sight inspection against caliper measurements"

      - name: Vision-Guided SCARA Pick-and-Place Robot (4 DoF) — Tecnológico de Monterrey
        url: /projects/scara-robot/
        start_date: 2026-02
        end_date: 2026-06
        summary: "Team of 4 · firmware, electronics and computer-vision integration"
        highlights:
          - "Built the vision pipeline: YOLOv11n shape/color classification (mAP@0.5 = 0.72) and ArUco-based pixel-to-mm homography, publishing pick coordinates over MQTT to the ESP32 firmware (C++, ESP-IDF, FreeRTOS)"
          - "Designed the control board in Altium Designer (ESP32, stepper/DC drivers, encoders, power distribution); selected motors and drivers and integrated the homing sensors (limit switch, AS5600 magnetic encoder)"
          - "Modeled forward/inverse kinematics and PID joint control in MATLAB/Simulink; final demo placed **5 of 6 parts** correctly at ~14 s per cycle"

      - name: Automated Viscosity Measurement System — Endress+Hauser industry challenge
        url: /projects/endress-viscosity/
        start_date: 2025-08
        end_date: 2025-12
        summary: "Team of 4 · PCB and embedded lead"
        highlights:
          - "Designed all three boards in Altium Designer: ESP32 master and slave (IPC-2221 trace sizing, fabricated by JLCPCB) and the op-amp measurement board"
          - "Co-developed a two-stage op-amp signal chain (1 Ω shunt, ~400× gain) that maps a 6 mA current window onto the ESP32 ADC range, **separating 252 cP from 1676 cP**; verified in Multisim and on hardware"
          - "Co-wrote the ESP32 firmware (homing and measurement routines, filtering, I²C color sensor, Bluetooth to a LabVIEW HMI, inter-board UART) and co-programmed the OpenPLC ladder logic for the sorting conveyors"

      - name: Scissor Lift & AGV — Automated Material Handling Platform
        url: /projects/agv-platform/
        start_date: 2025-02
        end_date: 2025-06
        summary: "Team of 5 · mechanical design and load-cell electronics"
        highlights:
          - "Built the full SolidWorks assembly; ran NX motion and SolidWorks static studies (max. arm deflection 0.28 mm); designed and 3D-printed the tilting cam (≥30° dump angle vs. ≥25° required)"
          - "Designed a load-cell conditioning PCB (Wheatstone bridge, op-amp stages, RC low-pass) without an HX711, giving a linear 0–3 V output over 0–5 kg into the ESP32 ADC"
          - "Turned and milled the aluminum motor coupler and connecting rod; frame load-tested **above 100 kg**, carried 7 kg at the final demo (5 kg required)"

